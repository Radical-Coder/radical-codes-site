name: Site checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Audit production dependency tree
        run: npm audit --audit-level=high
